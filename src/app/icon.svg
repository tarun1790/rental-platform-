<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Base Icon Background Pill -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5" />

  <!-- Chimney with red/white brick tile pattern -->
  <rect x="42" y="11" width="6" height="12" fill="#DC2626" rx="1"/>
  <rect x="41" y="9" width="8" height="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="1" rx="0.5"/>
  <line x1="42" y1="15" x2="48" y2="15" stroke="#FFFFFF" stroke-width="1"/>
  <line x1="45" y1="15" x2="45" y2="19" stroke="#FFFFFF" stroke-width="1"/>

  <!-- Tiled Gable Roof Structure -->
  <polygon points="32,6 7,26 57,26" fill="#DC2626" filter="url(#shadow)"/>
  
  <!-- Alternating White and Red Roof Tile Grid -->
  <!-- Top Peak Tile -->
  <polygon points="32,7 29,12 35,12" fill="#FFFFFF"/>
  
  <!-- Tier 2 Tiles -->
  <polygon points="26,13 30,13 28,17 24,17" fill="#FFFFFF"/>
  <polygon points="34,13 38,13 40,17 36,17" fill="#FFFFFF"/>
  <polygon points="30,13 34,13 36,17 28,17" fill="#DC2626"/>

  <!-- Tier 3 Tiles -->
  <polygon points="21,18 25,18 23,22 19,22" fill="#FFFFFF"/>
  <polygon points="26,18 30,18 28,22 24,22" fill="#DC2626"/>
  <polygon points="31,18 35,18 37,22 33,22" fill="#FFFFFF"/>
  <polygon points="36,18 40,18 42,22 38,22" fill="#DC2626"/>
  <polygon points="41,18 45,18 47,22 43,22" fill="#FFFFFF"/>
  
  <!-- Tier 4 Eaves Tiling (Alternating White & Red) -->
  <rect x="8" y="23" width="7" height="3.5" fill="#FFFFFF" rx="0.5"/>
  <rect x="16" y="23" width="7" height="3.5" fill="#DC2626" rx="0.5"/>
  <rect x="24" y="23" width="7" height="3.5" fill="#FFFFFF" rx="0.5"/>
  <rect x="32" y="23" width="7" height="3.5" fill="#DC2626" rx="0.5"/>
  <rect x="40" y="23" width="7" height="3.5" fill="#FFFFFF" rx="0.5"/>
  <rect x="48" y="23" width="8" height="3.5" fill="#DC2626" rx="0.5"/>

  <!-- House Main Walls (Pure White with Crisp Red Tiled Masonry / Grid) -->
  <rect x="12" y="26.5" width="40" height="31" fill="#FFFFFF" stroke="#DC2626" stroke-width="2" rx="1.5"/>

  <!-- Tiled Wall Grid Pattern (Row 1) -->
  <rect x="14" y="28.5" width="8" height="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8" rx="0.5"/>
  <rect x="23" y="28.5" width="8" height="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.8" rx="0.5"/>
  <rect x="32" y="28.5" width="8" height="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8" rx="0.5"/>
  <rect x="41" y="28.5" width="9" height="5" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.8" rx="0.5"/>

  <!-- Large Multi-Pane Modern Tiled Window (Left) -->
  <rect x="15" y="36.5" width="14" height="14" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" rx="1"/>
  <rect x="16" y="37.5" width="5.5" height="5.5" fill="#DC2626" opacity="0.9" rx="0.5"/>
  <rect x="22.5" y="37.5" width="5.5" height="5.5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.5" rx="0.5"/>
  <rect x="16" y="44" width="5.5" height="5.5" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="0.5" rx="0.5"/>
  <rect x="22.5" y="44" width="5.5" height="5.5" fill="#DC2626" opacity="0.9" rx="0.5"/>

  <!-- Red Entrance Door with Transom & Tiled Inset Panels -->
  <rect x="33" y="35.5" width="15" height="22" fill="#DC2626" stroke="#991B1B" stroke-width="1" rx="1"/>
  <!-- Door Inset White/Red Tiles -->
  <rect x="35" y="37.5" width="4.5" height="6.5" fill="#FFFFFF" rx="0.5"/>
  <rect x="41" y="37.5" width="4.5" height="6.5" fill="#FFFFFF" rx="0.5"/>
  <rect x="35" y="46" width="4.5" height="7.5" fill="#FEE2E2" rx="0.5"/>
  <rect x="41" y="46" width="4.5" height="7.5" fill="#FEE2E2" rx="0.5"/>
  <!-- Door Knob (Golden Accent) -->
  <circle cx="35.5" cy="46" r="0.9" fill="#FBBF24"/>

  <!-- Foundation Tiled Threshold (Alternating Red/White) -->
  <rect x="9" y="57.5" width="46" height="3" fill="#DC2626" rx="1"/>
  <rect x="31" y="57.5" width="19" height="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="0.8" rx="0.5"/>
</svg>
