<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>House Intelligence • Redirecting...</title>
  <script>
    (function() {
      var path = window.location.pathname;
      var repo = '/rental-platform-';
      
      // If missing the repo prefix, redirect to it
      if (path.indexOf(repo) !== 0) {
        window.location.replace(repo + (path.charAt(0) === '/' ? path : '/' + path));
      } else {
        // If within repo but sub-path had a typo, redirect to main platform dashboard
        window.location.replace(repo + '/');
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #F8FAFC; color: #0F172A; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px;">
  <div style="background: white; border: 1px solid #E2E8F0; border-radius: 20px; padding: 40px; text-align: center; max-width: 480px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
    <div style="font-size: 36px; margin-bottom: 12px;">🏠</div>
    <h2 style="font-size: 20px; font-weight: 800; color: #EF4444; margin: 0 0 8px 0;">House Intelligence</h2>
    <p style="font-size: 13px; color: #64748B; margin: 0 0 24px 0;">Navigating to verified real estate telemetry...</p>
    <a href="/rental-platform-/" style="display: inline-block; background-color: #EF4444; color: white; padding: 10px 24px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 12px; text-decoration: none;">Go to Map & Listings</a>
  </div>
</body>
</html>
