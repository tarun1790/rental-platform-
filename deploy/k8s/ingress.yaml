apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rental-platform-ingress
  namespace: rental-platform
  labels:
    app.kubernetes.io/name: rental-platform
    app.kubernetes.io/component: ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  tls:
    - hosts:
        - rentals.production.local
      secretName: rental-platform-tls
  rules:
    - host: rentals.production.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rental-platform-web
                port:
                  number: 80
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: rental-platform-n8n
                port:
                  number: 5678
