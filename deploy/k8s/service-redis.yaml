apiVersion: v1
kind: Service
metadata:
  name: rental-platform-redis
  namespace: rental-platform
  labels:
    app.kubernetes.io/name: rental-platform
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rental-platform
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
