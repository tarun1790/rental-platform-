apiVersion: v1
kind: Service
metadata:
  name: rental-platform-web
  namespace: rental-platform
  labels:
    app.kubernetes.io/name: rental-platform
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rental-platform
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
