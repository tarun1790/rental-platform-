{{- if .Values.n8n.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rental-platform.fullname" . }}-n8n
  labels:
    {{- include "rental-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rental-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: n8n
  template:
    metadata:
      labels:
        {{- include "rental-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: n8n
    spec:
      containers:
        - name: n8n
          image: "{{ .Values.n8n.image.repository }}:{{ .Values.n8n.image.tag }}"
          imagePullPolicy: {{ .Values.n8n.image.pullPolicy }}
          ports:
            - name: n8n-port
              containerPort: {{ .Values.n8n.port }}
              protocol: TCP
          env:
            - name: N8N_PORT
              value: {{ .Values.n8n.port | quote }}
            - name: N8N_PROTOCOL
              value: "http"
            - name: NODE_ENV
              value: "production"
            - name: GENERIC_TIMEZONE
              value: {{ .Values.global.timezone | quote }}
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "rental-platform.fullname" . }}-secrets
                  key: N8N_ENCRYPTION_KEY
            - name: N8N_BASIC_AUTH_ACTIVE
              value: "false"
            - name: EXECUTIONS_PROCESS
              value: "main"
          resources:
            {{- toYaml .Values.n8n.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.n8n.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.n8n.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          {{- if .Values.n8n.persistence.enabled }}
          volumeMounts:
            - name: n8n-storage
              mountPath: /home/node/.n8n
          {{- end }}
      {{- if .Values.n8n.persistence.enabled }}
      volumes:
        - name: n8n-storage
          persistentVolumeClaim:
            claimName: {{ include "rental-platform.fullname" . }}-n8n-data
      {{- end }}
{{- end }}
