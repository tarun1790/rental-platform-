apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rental-platform.fullname" . }}-secrets
  labels:
    {{- include "rental-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  N8N_ENCRYPTION_KEY: {{ .Values.secrets.n8nEncryptionKey | quote }}
  N8N_BASIC_AUTH_ACTIVE: "false"
  EXA_API_KEY: {{ .Values.secrets.exaApiKey | quote }}
  NEXTAUTH_SECRET: {{ .Values.secrets.nextauthSecret | quote }}
