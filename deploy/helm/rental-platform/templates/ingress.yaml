{{- if .Values.ingress.enabled -}}
{{- $fullName := include "rental-platform.fullname" . -}}
{{- $webPort := .Values.service.port -}}
{{- $n8nPort := .Values.n8n.port -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "rental-platform.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if eq .backend "n8n" }}{{ printf "%s-n8n" $fullName }}{{ else }}{{ printf "%s-web" $fullName }}{{ end }}
                port:
                  number: {{ if eq .backend "n8n" }}{{ $n8nPort }}{{ else }}{{ $webPort }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
