apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rental-platform.fullname" . }}-config
  labels:
    {{- include "rental-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
  NODE_ENV: {{ .Values.env.NODE_ENV | quote }}
  PORT: {{ .Values.env.PORT | quote }}
  HOSTNAME: {{ .Values.env.HOSTNAME | quote }}
  REDIS_URL: {{ printf "redis://%s-redis:%d" (include "rental-platform.fullname" .) (int .Values.redis.port) | quote }}
  N8N_WEBHOOK_URL: {{ printf "http://%s-n8n:%d/webhook/scrape-rentals" (include "rental-platform.fullname" .) (int .Values.n8n.port) | quote }}
  GENERIC_TIMEZONE: {{ .Values.global.timezone | quote }}
