apiVersion: v1
kind: Service
metadata:
  name: {{ include "rental-platform.fullname" . }}-web
  labels:
    {{- include "rental-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "rental-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
